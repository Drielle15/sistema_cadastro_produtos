
<!-- Container principal da página -->
<div class="container">

    <h2>Cadastro de Produtos</h2>
  
  
    <label>Descrição do Produto:</label>
    <input 
      type="text" 
      [(ngModel)]="descricao"
      placeholder="Digite o produto">
  
  
    <label>Valor:</label>
    <input 
      type="number"
      [(ngModel)]="valor"
      placeholder="Digite o valor">
  
  
    <div class="botoes">
  
      <button 
        (click)="adicionarProduto()">
        Adicionar
      </button>
  
  
      <button 
        (click)="limpar()">
        Limpar
      </button>
  
    </div>
  
  
    <h3>Lista de Produtos</h3>
  
  
    <table>
  
      <thead>
        <tr>
          <th>ID</th>
          <th>Descrição</th>
          <th>Valor</th>
          <th>Ação</th>
        </tr>
      </thead>
  
  
      <tbody>
  
        @for(produto of produtos; track produto.id){
  
          <tr>
  
            <td>
              {{produto.id}}
            </td>
  
  
            <td>
              {{produto.descricao}}
            </td>
  
  
            <td>
              R$ {{produto.valor}}
            </td>
  
  
            <td>
  
              <button 
                class="excluir"
                (click)="excluirProduto(produto.id)">
                Excluir
              </button>
  
            </td>
  
          </tr>
  
        }
  
      </tbody>
  
  
    </table>
  
  
  </div>
